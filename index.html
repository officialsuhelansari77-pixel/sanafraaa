<!DOCTYPE html>
<html>
<head>
  <title>Sumbul Fathma | Luxury Fashion</title>
  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#0f0f0f;
      color:white;
    }

    header{
      background:black;
      padding:20px;
      text-align:center;
      font-size:30px;
      letter-spacing:3px;
      font-weight:bold;
    }

    .hero{
      text-align:center;
      padding:100px 20px;
      background:linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.7)),
      url("https://images.unsplash.com/photo-1521335629791-ce4aec67dd47");
      background-size:cover;
      background-position:center;
    }

    .hero h1{
      font-size:45px;
    }

    .btn{
      padding:12px 25px;
      background:white;
      color:black;
      text-decoration:none;
      border-radius:5px;
      font-weight:bold;
      display:inline-block;
      margin-top:20px;
    }

    .products{
      padding:50px 20px;
      text-align:center;
    }

    .product{
      background:#1c1c1c;
      display:inline-block;
      margin:20px;
      padding:20px;
      border-radius:10px;
      width:220px;
    }

    .product img{
      width:100%;
      border-radius:8px;
    }

    .cart-btn{
      margin-top:10px;
      padding:8px 15px;
      background:white;
      color:black;
      border:none;
      cursor:pointer;
      border-radius:5px;
      font-weight:bold;
    }

    footer{
      text-align:center;
      padding:20px;
      background:black;
      margin-top:40px;
      font-size:14px;
      color:#aaa;
    }
  </style>
</head>

<body>

<header>
  Sumbul Fathma
</header>

<section class="hero">
  <h1>Luxury Fashion Brand</h1>
  <p>Premium • Elegant • Modern</p>
  <a href="#shop" class="btn">Shop Now</a>
</section>

<section class="products" id="shop">
  <h2>Our Collection</h2>

  <div class="product">
    <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab">
    <h3>Luxury Dress</h3>
    <p>₹2,999</p>
    <button class="cart-btn">Add to Cart</button>
  </div>

  <div class="product">
    <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f">
    <h3>Designer Top</h3>
    <p>₹1,499</p>
    <button class="cart-btn">Add to Cart</button>
  </div>

  <div class="product">
    <img src="https://images.unsplash.com/photo-1503342217505-b0a15ec3261c">
    <h3>Premium Wear</h3>
    <p>₹3,499</p>
    <button class="cart-btn">Add to Cart</button>
  </div>

</section>

<footer>
  © 2026 Sumbul Fathma | Luxury Fashion Store
</footer>

</body>
</html>
